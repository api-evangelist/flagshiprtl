aid: flagshiprtl
name: FlagshipRTL
description: FlagshipRTL (Flagship) is a SaaS company providing AI-powered inventory
  forecasting and merchandise planning software for retail brands, with a focus on
  apparel and direct-to-consumer (DTC) businesses. Its platform pairs demand forecasting
  at size-level granularity with multi-scenario planning, a purchase-order (PO) builder,
  and real-time inventory alerts to help retailers reduce stockouts and maximize full-price
  sell-through. Flagship reports optimizing over $2B in GMV for customers such as Bala,
  Mack Weldon, and Fresh Clean Threads, and integrates with systems including Shopify,
  NetSuite, Cin7, Snowflake, and Google Sheets. Backed by Insight Partners.
